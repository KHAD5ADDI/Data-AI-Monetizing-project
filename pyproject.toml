[project]
name = "verbatim-pipeline"
version = "1.0.0"
description = "Offline corpus preparation, enrichment, and retrieval evaluation pipeline for Verbatim."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=5.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
